[project]
name = "supportagent"
version = "0.1.0"
description = "Support-engineer agent, grown across the FDE M6 videos. Offline-testable, LangGraph + Langfuse."
requires-python = ">=3.10"
dependencies = [
    # The raw loop needs only an HTTP client for the live model path.
    "requests>=2",
    # The same loop on a framework (V1 framework beat).
    "langgraph>=0.2",
    # This step turns the run into a real OpenTelemetry trace and exports it to a
    # self-hosted Langfuse over OTLP. The core loop and tests run without these.
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    # Agentic retrieval: a real vector store with local ONNX embeddings (no key).
    "chromadb>=0.5",
    # Durable working memory: LangGraph's own SQLite checkpointer.
    "langgraph-checkpoint-sqlite>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["supportagent*"]
