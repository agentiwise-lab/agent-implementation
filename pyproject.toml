[project]
name = "supportagent"
version = "0.1.0"
description = "Support-engineer agent, grown across the FDE M6 videos. Offline-testable, LangGraph + Langfuse."
requires-python = ">=3.10"
dependencies = [
    # The smallest agent needs only an HTTP client for the live model path.
    # The loop, the fake model, and the tests run with nothing but the stdlib.
    "requests>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["supportagent*"]
